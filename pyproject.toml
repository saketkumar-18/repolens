[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repolens"
version = "0.1.0"
description = "LLM code-review agent with repo-level context retrieval: PR diff + full-repo indexing -> line-level review comments."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Saket Kumar" }]
keywords = ["code-review", "llm", "pull-request", "static-analysis", "retrieval"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
repolens = "repolens.cli:main"

[project.urls]
Homepage = "https://github.com/saketkumar-18/repolens"

[tool.hatch.build.targets.wheel]
packages = ["src/repolens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# diff fixtures contain intentional context-line whitespace
"tests/conftest.py" = ["W293"]
